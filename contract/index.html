<style>
:root{--navy:#1f3864;--ink:#1d2433;--sub:#5b6577;--line:#d5dbe5;--bg:#eef1f6;--err:#c0392b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);padding:16px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:32px 28px;box-shadow:0 6px 24px rgba(31,56,100,.08)}
.logo{width:44px;height:44px;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
h1{font-size:19px;margin:0 0 6px}
.sub{font-size:13.5px;color:var(--sub);margin:0 0 20px;line-height:1.55}
input{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:7px;outline:none}
input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,56,100,.12)}
button{width:100%;margin-top:10px;font:inherit;font-size:15px;font-weight:600;padding:11px;border:0;border-radius:7px;background:var(--navy);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{min-height:20px;margin-top:10px;font-size:13px;color:var(--err);line-height:1.5}
#err.info{color:var(--sub)}
.foot{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);line-height:1.6}
</style>
</head>

<script>
(function(){
// 열쇠 파일: jinolabor 조직 저장소를 먼저, 없으면 예전 주소(dhkim0629-ops)
const KEY_URLS=["https://raw.githubusercontent.com/jinolabor/config-files/main/key.json","https://raw.githubusercontent.com/dhkim0629-ops/config-files/main/key.json"];
let KEY_URL=KEY_URLS[KEY_URLS.length-1];
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const say=(t,info)=>{const e=$('err');e.textContent=t;e.className=info?'info':''};
async function getKey(){
  let last;
  for(const u of KEY_URLS){
    try{
      const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error('http '+r.status);
      const j=await r.json();
      if(!j||!(Array.isArray(j.entries)||j.wk)) throw new Error('bad key file');
      KEY_URL=u; return j;
    }catch(e){last=e}
  }
  throw last||new Error('no key');
}
async function openApp(){
  const pw=$('pw').value;if(!pw){$('pw').focus();return}
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){say('이 브라우저에서는 열 수 없습니다. 최신 Chrome이나 Edge로 열어 주세요.');return}
  $('go').disabled=true;say('확인 중…',true);
  let j;
  try{j=await getKey()}catch(e){$('go').disabled=false;
    const m=String(e&&e.message||'');
    say(e&&e.name==='SyntaxError'?'열쇠 파일 내용이 올바르지 않습니다. 관리자에게 알려 주세요.'
      :/^http 404/.test(m)?'열쇠 파일이 아직 없습니다. 관리자에게 알려 주세요.'
      :/^http /.test(m)||e instanceof TypeError?'열쇠 파일을 확인하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.'
      :'열쇠 파일 내용이 올바르지 않습니다. 관리자에게 알려 주세요.');return}
  // 열쇠 파일의 여러 줄(대표님 마스터키, 구성원별) 중 이 비밀번호로 풀리는 줄을 찾음
  const entries=Array.isArray(j&&j.entries)?j.entries:(j&&j.salt&&j.wk&&j.iv?[{id:j.kid||'single',salt:j.salt,iv:j.iv,wk:j.wk,iter:j.iter}]:[]);
  if(!entries.length){$('go').disabled=false;say('열쇠 파일 내용이 올바르지 않습니다. 관리자에게 알려 주세요.');return}
  let K=null,eid=null;
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const tryOne=async e=>{
      const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter||j.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      return {k:await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},wk,b64(e.wk)),id:e.id};
    };
    const r=await Promise.any(entries.map(tryOne));K=r.k;eid=r.id;
  }catch(e){$('go').disabled=false;say('비밀번호가 맞지 않습니다.');$('pw').select();return}
  window.__mt=await mtok(eid,pw);
  await enter(j,K,eid,true);
}
// 로그인 정보는 이 창(탭)에만 보관: 새로고침해도 유지, 창을 닫거나 로그아웃하면 지워짐
const SK='jinoContractSession';
async function mtok(id,pw){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jino-payroll-member|'+id+'|'+pw)));return btoa(String.fromCharCode(...h))}
async function nameOf(j,K,eid){
  const e=(j.entries||[]).find(x=>x.id===eid);
  if(e&&e.n){try{const key=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.n.iv)},key,b64(e.n.ct)))}catch(x){}}
  return eid==='master'?'대표':'구성원';
}
async function enter(j,K,eid,fresh){
  let html;
  try{
    const P=JSON.parse($('payload').textContent);
    const key=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
    const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }catch(e){try{sessionStorage.removeItem(SK)}catch(x){}$('go').disabled=false;say('이 프로그램은 더 이상 쓸 수 없습니다. 관리자에게 알려 주세요.');return}
  const name=await nameOf(j,K,eid);
  try{sessionStorage.setItem(SK,JSON.stringify({k:btoa(String.fromCharCode(...new Uint8Array(K))),eid,mt:window.__mt||''}))}catch(x){}
  const cfg=JSON.stringify({url:KEY_URL,kid:j.kid,eid,multi:Array.isArray(j.entries),name,web:true,mt:window.__mt||'',k:btoa(String.fromCharCode(...new Uint8Array(K)))});
  html=html.split('__OFFCFG__').join(cfg);
  document.open();document.write(html);document.close();
}
// 이미 로그인한 창이면: 열쇠 파일에 아직 내 줄이 있는지 확인한 뒤 바로 들어감
(async()=>{
  let ss=null;try{ss=JSON.parse(sessionStorage.getItem(SK)||'null')}catch(x){}
  if(!ss||!ss.k||!ss.eid)return;
  $('go').disabled=true;say('로그인 확인 중…',true);
  try{const j=await getKey();
    if(!Array.isArray(j.entries)||!j.entries.some(e=>e.id===ss.eid))throw new Error('revoked');
    window.__mt=ss.mt||'';await enter(j,b64(ss.k).buffer,ss.eid,false);
  }catch(e){try{sessionStorage.removeItem(SK)}catch(x){}$('go').disabled=false;say(e&&e.message==='revoked'?'다시 로그인해 주세요.':'',true)}
})();
$('go').onclick=openApp;
$('pw').onkeydown=e=>{if(e.key==='Enter')openApp()};
})();
</script>
